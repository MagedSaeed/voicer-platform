services:
  # Main Voice Recording App
  voicer-main:
    build:
      context: .
      dockerfile: Dockerfile.main
    container_name: voicer-main
    ports:
      - "7860:7860"
    environment:
      # Supabase
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      # AWS S3
      - AWS_ACCESS_KEY=${AWS_ACCESS_KEY}
      - AWS_SECRET_KEY=${AWS_SECRET_KEY}
      - S3_BUCKET=${S3_BUCKET:-voicer-storage}
      - AWS_REGION=${AWS_REGION:-me-south-1}
      # Gradio
      - GRADIO_SERVER_NAME=0.0.0.0
      - GRADIO_SERVER_PORT=7860
    volumes:
      # Mount app code for hot reload during development
      - ./main_app:/app/main_app:ro
    restart: unless-stopped
    networks:
      - voicer-network

  # Admin Dashboard
  voicer-admin:
    build:
      context: .
      dockerfile: Dockerfile.admin
    container_name: voicer-admin
    ports:
      - "7861:7861"
    environment:
      # Supabase (prefer service role key for admin)
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      # AWS S3
      - AWS_ACCESS_KEY=${AWS_ACCESS_KEY}
      - AWS_SECRET_KEY=${AWS_SECRET_KEY}
      - S3_BUCKET=${S3_BUCKET:-voicer-storage}
      - AWS_REGION=${AWS_REGION:-me-south-1}
      # Gradio
      - GRADIO_SERVER_NAME=0.0.0.0
      - GRADIO_SERVER_PORT=${GRADIO_ADMIN_PORT:-7860}
      - GRADIO_ADMIN_PORT=${GRADIO_ADMIN_PORT:-7861}
    volumes:
      # Mount app code for hot reload during development
      - ./admin_app:/app/admin_app:ro
    restart: unless-stopped
    networks:
      - voicer-network

  # Annotation Tool
  voicer-annotate:
    build:
      context: .
      dockerfile: Dockerfile.annotate
    container_name: voicer-annotate
    ports:
      - "7862:7862"
    environment:
      # Supabase
      - SUPABASE_URL_2=${SUPABASE_URL_2:-${SUPABASE_URL}}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - SUPABASE_KEY_2=${SUPABASE_KEY_2}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-${SUPABASE_KEY}}
      # AWS S3
      - AWS_ACCESS_KEY=${AWS_ACCESS_KEY}
      - AWS_SECRET_KEY=${AWS_SECRET_KEY}
      - S3_BUCKET=${S3_BUCKET:-voicer-storage}
      - AWS_REGION=${AWS_REGION:-me-south-1}
      # Gradio / App
      - GRADIO_SERVER_NAME=0.0.0.0
      - GRADIO_SERVER_PORT=7862
      - PORT=7862
    volumes:
      - ./annotate_app:/app/annotate_app:ro
    restart: unless-stopped
    networks:
      - voicer-network

  # MSA App
  voicer-msa:
    build:
      context: .
      dockerfile: Dockerfile.msa
    container_name: voicer-msa
    ports:
      - "7863:7863"
    environment:
      # Supabase
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      # AWS S3
      - AWS_ACCESS_KEY=${AWS_ACCESS_KEY}
      - AWS_SECRET_KEY=${AWS_SECRET_KEY}
      - S3_BUCKET=${S3_BUCKET:-voicer-storage}
      - AWS_REGION=${AWS_REGION:-me-south-1}
      # Gradio
      - GRADIO_SERVER_NAME=0.0.0.0
      - GRADIO_SERVER_PORT=7863
    volumes:
      # Mount app code for hot reload during development
      - ./msa_app:/app/msa_app:ro
    restart: unless-stopped
    networks:
      - voicer-network

networks:
  voicer-network:
    driver: bridge
